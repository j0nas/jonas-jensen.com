[build]
command = "pnpm run build"
publish = "dist"

# ── Canonical host ──────────────────────────────────────────────────────────
# jona.no is the primary domain. jonas-jensen.com stays attached to the site so
# existing links keep resolving, but every request to it 301s to the canonical
# host. Netlify's "primary domain" setting only governs the www/apex pairing of
# the primary itself — it does *not* redirect other domain aliases, which would
# otherwise leave both hosts serving identical content at 200.
#
# These MUST precede the proxy and SPA rules below: Netlify applies the first
# matching rule, so anything above would strand legacy-host traffic on the old
# domain. `force = true` is required to override the alias's own 200 response.
[[redirects]]
from = "https://jonas-jensen.com/*"
to = "https://jona.no/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.jonas-jensen.com/*"
to = "https://jona.no/:splat"
status = 301
force = true

# ── Embedded apps ───────────────────────────────────────────────────────────
# Each embedded app is a separate repo that deploys itself — the app is the
# source of truth. The desktop embeds the *live* deploy by proxying its path to
# that deploy, so nothing is re-vendored here: pushing the app ships it.
#
# These proxy rules MUST precede the SPA catch-all below. Netlify applies the
# first matching rule, and a 200-rewrite to an external URL proxies it
# same-origin — so the <iframe> and the shareable /apps/<id>/ link need no CORS
# or framing exceptions, and the app's relative (base: "./") asset paths resolve
# under the subpath.
[[redirects]]
from = "/apps/floor-planner/*"
to = "https://j0nas.github.io/floor-boards-planner/:splat"
status = 200

[[redirects]]
from = "/apps/deck-box/*"
to = "https://j0nas.github.io/parametric-mtg-deck-box/:splat"
status = 200

[[redirects]]
from = "/apps/laser-deck-box/*"
to = "https://j0nas.github.io/laser-mtg-deck-box/:splat"
status = 200

[[redirects]]
from = "/apps/lamp-shade/*"
to = "https://j0nas.github.io/lamp-shade-designer/:splat"
status = 200

# SPA fallback for the desktop shell. A deep link like /floor-planner is an
# unknown path that falls through to the shell, which opens the matching window.
# Keep this last.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
