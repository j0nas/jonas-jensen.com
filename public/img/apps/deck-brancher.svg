<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- branches: trunk down from the commander, forking to three cards -->
  <rect x="15" y="12" width="2" height="4" fill="#a86f0c"/>
  <rect x="5" y="16" width="22" height="2" fill="#a86f0c"/>
  <rect x="5" y="18" width="2" height="3" fill="#a86f0c"/>
  <rect x="15" y="18" width="2" height="3" fill="#a86f0c"/>
  <rect x="25" y="18" width="2" height="3" fill="#a86f0c"/>
  <!-- commander card: dark outline, gold frame, art window, text lines -->
  <rect x="10" y="0" width="12" height="13" fill="#3a2606"/>
  <rect x="11" y="1" width="10" height="11" fill="#f5b83d"/>
  <rect x="12" y="2" width="8" height="5" fill="#7a3b1c"/>
  <rect x="13" y="3" width="3" height="2" fill="#e56a4f"/>
  <rect x="12" y="8" width="8" height="1" fill="#fff4d6"/>
  <rect x="12" y="10" width="5" height="1" fill="#c98a1a"/>
  <!-- left card (in the deck) -->
  <rect x="1" y="20" width="10" height="12" fill="#1d2230"/>
  <rect x="2" y="21" width="8" height="10" fill="#e3e6ee"/>
  <rect x="3" y="22" width="6" height="4" fill="#4fb07a"/>
  <rect x="3" y="27" width="6" height="1" fill="#8a94aa"/>
  <rect x="3" y="29" width="4" height="1" fill="#8a94aa"/>
  <!-- middle card: a suggestion — dimmed, with a dashed gold outline -->
  <rect x="12" y="21" width="8" height="10" fill="#8a94aa"/>
  <rect x="13" y="22" width="6" height="4" fill="#3c4559"/>
  <rect x="13" y="27" width="6" height="1" fill="#5b667e"/>
  <rect x="11" y="20" width="2" height="1" fill="#f5b83d"/>
  <rect x="15" y="20" width="2" height="1" fill="#f5b83d"/>
  <rect x="19" y="20" width="2" height="1" fill="#f5b83d"/>
  <rect x="11" y="31" width="2" height="1" fill="#f5b83d"/>
  <rect x="15" y="31" width="2" height="1" fill="#f5b83d"/>
  <rect x="19" y="31" width="2" height="1" fill="#f5b83d"/>
  <rect x="11" y="23" width="1" height="2" fill="#f5b83d"/>
  <rect x="11" y="27" width="1" height="2" fill="#f5b83d"/>
  <rect x="20" y="23" width="1" height="2" fill="#f5b83d"/>
  <rect x="20" y="27" width="1" height="2" fill="#f5b83d"/>
  <!-- right card (in the deck) -->
  <rect x="21" y="20" width="10" height="12" fill="#1d2230"/>
  <rect x="22" y="21" width="8" height="10" fill="#e3e6ee"/>
  <rect x="23" y="22" width="6" height="4" fill="#5aa4e0"/>
  <rect x="23" y="27" width="6" height="1" fill="#8a94aa"/>
  <rect x="23" y="29" width="4" height="1" fill="#8a94aa"/>
</svg>
