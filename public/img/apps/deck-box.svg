<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- a card peeking out of the open box -->
  <rect x="12" y="1" width="9" height="12" fill="#f4ead8"/>
  <rect x="13" y="2" width="7" height="5" fill="#8a4f2d"/>
  <rect x="12.5" y="1.5" width="8" height="11" fill="none" stroke="#4a3520"/>
  <!-- box body -->
  <rect x="4" y="10" width="24" height="20" fill="#3f5aa8"/>
  <!-- shading: lit left face edge and darker right edge -->
  <rect x="5" y="11" width="2" height="18" fill="#5a77c8"/>
  <rect x="25" y="11" width="2" height="18" fill="#2e4483"/>
  <!-- lid band with a flush seam line -->
  <rect x="3" y="8" width="26" height="7" fill="#5a77c8"/>
  <rect x="4" y="9" width="2" height="5" fill="#7690d6"/>
  <rect x="3" y="15" width="26" height="1" fill="#22335f"/>
  <!-- thumb notch dipping into the lid's front edge -->
  <rect x="13" y="8" width="6" height="3" fill="#22335f"/>
  <!-- outlines -->
  <rect x="3.5" y="8.5" width="25" height="7" fill="none" stroke="#1a2747"/>
  <rect x="4.5" y="10.5" width="23" height="19" fill="none" stroke="#1a2747"/>
</svg>
