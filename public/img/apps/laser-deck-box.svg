<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- dark plywood backing: the finger-joint gaps read against it -->
  <rect x="4" y="4" width="24" height="25" fill="#4a3520"/>
  <!-- box front face (plywood) -->
  <rect x="8" y="6" width="16" height="20" fill="#bd9152"/>
  <!-- lit left edge / shaded right edge -->
  <rect x="8"  y="6" width="2" height="20" fill="#caa15f"/>
  <rect x="22" y="6" width="2" height="20" fill="#9c7439"/>
  <!-- sliding lid band with a flush seam line -->
  <rect x="8" y="6"  width="16" height="4" fill="#caa15f"/>
  <rect x="8" y="10" width="16" height="1" fill="#7a5a30"/>
  <!-- faint vertical wood grain on the body -->
  <rect x="13" y="12" width="1" height="13" fill="#b0854a"/>
  <rect x="18" y="12" width="1" height="13" fill="#b0854a"/>
  <!-- left-edge finger joints (protruding tabs) -->
  <rect x="5" y="6"  width="3" height="3" fill="#caa15f"/>
  <rect x="5" y="12" width="3" height="3" fill="#caa15f"/>
  <rect x="5" y="18" width="3" height="3" fill="#caa15f"/>
  <rect x="5" y="24" width="3" height="2" fill="#caa15f"/>
  <!-- right-edge finger joints (offset, interlocking) -->
  <rect x="24" y="9"  width="3" height="3" fill="#9c7439"/>
  <rect x="24" y="15" width="3" height="3" fill="#9c7439"/>
  <rect x="24" y="21" width="3" height="3" fill="#9c7439"/>
  <!-- red laser beam burning a cut into the lid, with scorch + spark -->
  <rect x="21" y="8" width="3" height="1" fill="#6b3a1a"/>
  <rect x="22" y="6" width="2" height="2" fill="#ff7a2f"/>
  <rect x="27" y="2" width="1" height="1" fill="#ff3b2f"/>
  <rect x="26" y="3" width="1" height="1" fill="#ff3b2f"/>
  <rect x="25" y="4" width="1" height="1" fill="#ff3b2f"/>
  <rect x="24" y="5" width="1" height="1" fill="#ff3b2f"/>
  <rect x="23" y="6" width="1" height="1" fill="#ffe14a"/>
  <!-- outer frame -->
  <rect x="3.5" y="3.5" width="25" height="26" fill="none" stroke="#2e2013"/>
</svg>
