<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- pendant cord and the fitter ring the shade hangs from -->
  <rect x="15" y="0" width="2" height="4" fill="#241041"/>
  <rect x="13" y="4" width="6" height="2" fill="#3a1c6b"/>
  <!-- empire silhouette, stepped outward two pixels at a time: narrow top rim
       widening to the bottom, each band lit on the left and shaded on the right -->
  <rect x="12" y="6" width="8" height="2" fill="#421691"/>
  <rect x="12" y="6" width="1" height="2" fill="#5c2bb8"/>
  <rect x="19" y="6" width="1" height="2" fill="#2a0e5e"/>
  <rect x="11" y="8" width="10" height="2" fill="#421691"/>
  <rect x="11" y="8" width="1" height="2" fill="#5c2bb8"/>
  <rect x="20" y="8" width="1" height="2" fill="#2a0e5e"/>
  <rect x="10" y="10" width="12" height="2" fill="#421691"/>
  <rect x="10" y="10" width="1" height="2" fill="#5c2bb8"/>
  <rect x="21" y="10" width="1" height="2" fill="#2a0e5e"/>
  <rect x="9" y="12" width="14" height="2" fill="#421691"/>
  <rect x="9" y="12" width="1" height="2" fill="#5c2bb8"/>
  <rect x="22" y="12" width="1" height="2" fill="#2a0e5e"/>
  <rect x="8" y="14" width="16" height="2" fill="#421691"/>
  <rect x="8" y="14" width="1" height="2" fill="#5c2bb8"/>
  <rect x="23" y="14" width="1" height="2" fill="#2a0e5e"/>
  <rect x="7" y="16" width="18" height="2" fill="#421691"/>
  <rect x="7" y="16" width="1" height="2" fill="#5c2bb8"/>
  <rect x="24" y="16" width="1" height="2" fill="#2a0e5e"/>
  <rect x="6" y="18" width="20" height="2" fill="#421691"/>
  <rect x="6" y="18" width="1" height="2" fill="#5c2bb8"/>
  <rect x="25" y="18" width="1" height="2" fill="#2a0e5e"/>
  <rect x="5" y="20" width="22" height="2" fill="#421691"/>
  <rect x="5" y="20" width="1" height="2" fill="#5c2bb8"/>
  <rect x="26" y="20" width="1" height="2" fill="#2a0e5e"/>
  <!-- staggered perforations, lit from inside -->
  <rect x="13" y="10" width="2" height="2" fill="#ffd76a"/>
  <rect x="17" y="10" width="2" height="2" fill="#ffd76a"/>
  <rect x="11" y="14" width="2" height="2" fill="#ffd76a"/>
  <rect x="15" y="14" width="2" height="2" fill="#ffd76a"/>
  <rect x="19" y="14" width="2" height="2" fill="#ffd76a"/>
  <rect x="9" y="18" width="2" height="2" fill="#ffd76a"/>
  <rect x="13" y="18" width="2" height="2" fill="#ffd76a"/>
  <rect x="17" y="18" width="2" height="2" fill="#ffd76a"/>
  <rect x="21" y="18" width="2" height="2" fill="#ffd76a"/>
  <!-- the glowing bottom opening, then light spilling out and fading -->
  <rect x="5" y="22" width="22" height="2" fill="#ffd76a"/>
  <rect x="7" y="24" width="18" height="1" fill="#ffb347"/>
  <rect x="10" y="25" width="12" height="1" fill="#c9762a"/>
</svg>
